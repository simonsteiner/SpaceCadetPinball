# Git hooks for this repository, run by lefthook (https://lefthook.dev). See docs/setup.md.
# They catch mistakes before CI does; CI stays the gate.
# Skip them once with LEFTHOOK=0 git commit ..., or git commit --no-verify.

pre-commit:
  parallel: true
  commands:
    no-game-data:
      run: tools/hooks/no-game-data.sh {staged_files}
    whitespace:
      # Trailing whitespace and leftover conflict markers in the staged changes
      run: git diff --cached --check
    sources:
      run: tools/hooks/check-sources.sh {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: tools/hooks/commit-msg.sh {1}

pre-push:
  commands:
    build-and-replays:
      run: tools/hooks/pre-push.sh {push_files}
