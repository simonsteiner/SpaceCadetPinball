name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 has no SDL3 or SDL3_mixer packages; Debian testing has both
          - { preset: linux, os: ubuntu-24.04, container: "debian:forky-slim@sha256:3c80e257eff6274d593eb33a94bda5174ccd619836e6a728a73e11c97f2213e3" }
          - { preset: linux-vendored, os: ubuntu-24.04 }
          - { preset: mingw, os: ubuntu-24.04 }
          # windows-latest has Visual Studio 2026; the presets use the Visual Studio 2022 generator.
          - { preset: windows-x64, os: windows-2022 }
          - { preset: macos, os: macos-26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system SDL packages
        if: matrix.preset == 'linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build g++ libsdl3-dev libsdl3-mixer-dev

      # SDL3 stops configuring when a header for an X11 extension it wants is missing,
      # and without the audio and Wayland headers it builds without those backends
      - name: Install SDL build dependencies
        if: matrix.preset == 'linux-vendored'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl-dev libgl-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev

      - name: Install MinGW
        if: matrix.preset == 'mingw'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: Configure
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --preset "$PRESET" -DSCP_WARNINGS=ON
        shell: bash

      - name: Build
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$PRESET" --parallel 4
        shell: bash

  # clang-format and clang-tidy on the lines a pull request changes; the code is never reformatted as a whole
  lint:
    name: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container: "debian:forky-slim@sha256:3c80e257eff6274d593eb33a94bda5174ccd619836e6a728a73e11c97f2213e3"
    timeout-minutes: 20
    steps:
      # git must be there before checkout, or it downloads the files without history
      - name: Install build tools and SDL packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build g++ python3-venv libsdl3-dev libsdl3-mixer-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install clang-format and clang-tidy
        run: |
          python3 -m venv /opt/llvm
          /opt/llvm/bin/pip install --require-hashes --no-deps --only-binary :all: -r tools/llvm-requirements.txt

      # The compile database is all clang-tidy needs; without the precompiled header, each file parses on its own
      - name: Configure
        run: cmake -S . -B build/lint -G Ninja -DSCP_VENDORED_SDL=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      # A pull request is checked out as its merge into the base, so HEAD^1 is the base it is compared with,
      # even when the base branch has moved on since the run started
      - name: Check changed lines
        env:
          CLANG_FORMAT_DIR: /opt/llvm/bin
          CLANG_TIDY_DIR: /opt/llvm/bin
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify --quiet HEAD^2 >/dev/null || { echo "HEAD is not a pull request merge commit" >&2; exit 1; }
          tools/lint-changed.sh HEAD^1 build/lint
