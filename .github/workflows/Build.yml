name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux, os: ubuntu-24.04 }
          - { preset: linux-vendored, os: ubuntu-24.04 }
          - { preset: mingw, os: ubuntu-24.04 }
          # windows-latest has Visual Studio 2026; the presets use the Visual Studio 2022 generator.
          # windows-x86-xp is left out: no runner image has the v141_xp toolset.
          - { preset: windows-x64, os: windows-2022 }
          - { preset: windows-x86, os: windows-2022 }
          - { preset: macos, os: macos-26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system SDL packages
        if: matrix.preset == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libsdl2-dev libsdl2-mixer-dev

      # Without these headers SDL still builds, but with no video or audio backend
      - name: Install SDL build dependencies
        if: matrix.preset == 'linux-vendored'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libegl-dev libgl-dev

      - name: Install MinGW
        if: matrix.preset == 'mingw'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: Configure
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --preset "$PRESET" -DSCP_WARNINGS=ON
        shell: bash

      - name: Build
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$PRESET" --parallel 4
        shell: bash
