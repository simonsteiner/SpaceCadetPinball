name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 24.04 has no SDL3 or SDL3_mixer packages; Debian testing has both
          - { preset: linux, os: ubuntu-24.04, container: "debian:forky-slim@sha256:3c80e257eff6274d593eb33a94bda5174ccd619836e6a728a73e11c97f2213e3" }
          - { preset: linux-vendored, os: ubuntu-24.04 }
          - { preset: mingw, os: ubuntu-24.04 }
          # windows-latest has Visual Studio 2026; the presets use the Visual Studio 2022 generator.
          - { preset: windows-x64, os: windows-2022 }
          - { preset: macos, os: macos-26 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system SDL packages
        if: matrix.preset == 'linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build g++ libsdl3-dev libsdl3-mixer-dev

      # SDL3 stops configuring when a header for an X11 extension it wants is missing,
      # and without the audio and Wayland headers it builds without those backends
      - name: Install SDL build dependencies
        if: matrix.preset == 'linux-vendored'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libegl-dev libgl-dev libdrm-dev libgbm-dev libudev-dev libdbus-1-dev

      - name: Install MinGW
        if: matrix.preset == 'mingw'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: Configure
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --preset "$PRESET" -DSCP_WARNINGS=ON
        shell: bash

      - name: Build
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$PRESET" --parallel 4
        shell: bash
