# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit's settings for the fork; anything not set here keeps CodeRabbit's default.
reviews:
  auto_review:
    # Pull requests into main are reviewed once, when they open or are retargeted to main; pull requests stacked on
    # another branch aren't reviewed until then (base_branches stays empty). A push doesn't start another round:
    # on the stack #190 to #200 each push did, mostly with findings on comments already passed. Ask for a new round
    # with "@coderabbitai review" in a comment.
    auto_incremental_review: false
