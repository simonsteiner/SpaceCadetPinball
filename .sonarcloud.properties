# SonarCloud's automatic analysis of the fork. The rules it ignores are in the project's settings; docs/setup.md lists them.
# tools/build-shaders.sh generates PostEffectShaders.h (the compiled shaders' bytes and the .msl text), so it is left
# out of the analysis and of the duplication count. The binary files (icons, screenshots, fonts, the splash bitmap and
# the function stats) are left out too: a pull request's analysis reads them as UTF-8 text and warns about their encoding.
# Vendored code (ImGui in SpaceCadetPinball/, and third_party/) is upstream code that is upgraded as a set, with only the
# few local edits third_party/README.md lists, so its issues are not this project's to fix.
sonar.exclusions=SpaceCadetPinball/shaders/PostEffectShaders.h,SpaceCadetPinball/imgui*,SpaceCadetPinball/imstb_*.h,SpaceCadetPinball/imconfig.h,third_party/**,**/*.png,**/*.ico,**/*.icns,**/*.jpg,**/*.bmp,**/*.ttf,**/*.xlsx
# The Python of CI's Debian image (debian:forky-slim in .github/workflows/Build.yml), which runs tools/bidi/compare.py
sonar.python.version=3.14
